# ============================================================
# Docker Compose — StockAdvisor (Development)
# ============================================================
# Services: MySQL, Redis, Backend (Daphne), Frontend (React),
#           Celery Worker, Celery Beat
#
# Khởi chạy: docker compose up --build
# Dừng:      docker compose down
# Reset DB:  docker compose down -v
# ============================================================

services:
  # ===========================================================
  # DATABASE — MySQL 8.0
  # ===========================================================
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123123}
      MYSQL_DATABASE: ${DB_NAME:-stock_advisor_db}
    ports:
      - "3307:3306" # Host 3307 để không xung đột với MySQL local
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-p${DB_PASSWORD:-123123}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --default-authentication-plugin=mysql_native_password

  # ===========================================================
  # CACHE / BROKER — Redis 7
  # ===========================================================
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================
  # BACKEND — Django + Daphne (ASGI)
  # ===========================================================
  backend:
    build: ./backend
    command: daphne -b 0.0.0.0 -p 8000 investcore.asgi:application
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app # Hot-reload: thay đổi code local → container cập nhật
      - /app/__pycache__ # Không mount __pycache__ từ host
    env_file:
      - ./backend/.env
    environment:
      # Override để dùng tên service Docker thay vì localhost
      - DB_HOST=db
      - DB_PORT=3306
      - REDIS_URL=redis://redis:6379/0
      - CHANNEL_REDIS_HOST=redis
      - RUN_MIGRATIONS=true # Chỉ backend chính chạy migrate
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/admin/')",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ===========================================================
  # FRONTEND — React Dev Server
  # ===========================================================
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src # Hot-reload chỉ mount src (giữ node_modules trong container)
      - ./frontend/public:/app/public
    environment:
      - VITE_API_URL=http://localhost:8000/api
      - VITE_WS_URL=ws://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
    stdin_open: true # Giữ container chạy (react-scripts cần tty)

  # ===========================================================
  # CELERY WORKER — Xử lý tác vụ nền
  # ===========================================================
  celery_worker:
    build: ./backend
    command: celery -A investcore worker -l info -P gevent -c 4
    volumes:
      - ./backend:/app
      - /app/__pycache__
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - REDIS_URL=redis://redis:6379/0
      - CHANNEL_REDIS_HOST=redis
      - CELERY_TASK_ALWAYS_EAGER=False
    depends_on:
      backend:
        condition: service_healthy # Đợi backend migrate xong
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ===========================================================
  # CELERY BEAT — Lập lịch tác vụ định kỳ
  # ===========================================================
  celery_beat:
    build: ./backend
    command: celery -A investcore beat -l info -S django
    volumes:
      - ./backend:/app
      - /app/__pycache__
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - REDIS_URL=redis://redis:6379/0
      - CHANNEL_REDIS_HOST=redis
      - CELERY_TASK_ALWAYS_EAGER=False
    depends_on:
      backend:
        condition: service_healthy # Đợi backend migrate xong
      redis:
        condition: service_healthy
    restart: unless-stopped

# ===========================================================
# VOLUMES — Dữ liệu bền vững
# ===========================================================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
