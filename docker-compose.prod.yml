# ============================================================
# Docker Compose — StockAdvisor (PRODUCTION)
# ============================================================
# 6 services: Nginx, Backend, Celery Worker, Celery Beat, MySQL, Redis
#
# Khởi chạy:  docker compose -f docker-compose.prod.yml up -d --build
# Xem logs:   docker compose -f docker-compose.prod.yml logs -f
# Dừng:       docker compose -f docker-compose.prod.yml down
# Reset DB:   docker compose -f docker-compose.prod.yml down -v
# Rebuild:    docker compose -f docker-compose.prod.yml up -d --build
# ============================================================
#
# Kiến trúc:
#   Internet → Nginx (:80)
#     ├── / → React static files (trong Nginx image)
#     ├── /api/, /admin/ → Backend (:8000)
#     ├── /ws/ → Backend WebSocket (:8000)
#     └── /static/ → Django static (shared volume)
#
# ============================================================

services:
  # ===========================================================
  # DATABASE — MySQL 8.0
  # ===========================================================
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    # ❌ KHÔNG expose port ra host (bảo mật)
    # Chỉ các container trong cùng network mới truy cập được
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - app-network

  # ===========================================================
  # CACHE / BROKER — Redis 7
  # ===========================================================
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # ❌ KHÔNG expose port ra host (bảo mật)
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ===========================================================
  # BACKEND — Django + Daphne (ASGI)
  # ===========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    command: daphne -b 0.0.0.0 -p 8000 investcore.asgi:application
    # ❌ KHÔNG có volumes mount code (code đã COPY vào image)
    # ❌ KHÔNG expose port ra host (Nginx sẽ proxy)
    volumes:
      # Shared volume cho Django static files (Nginx serve)
      - static_files:/app/staticfiles
    env_file:
      - ./backend/.env.prod
    environment:
      # Override để dùng tên service Docker thay vì localhost
      - DB_HOST=db
      - DB_PORT=3306
      - REDIS_URL=redis://redis:6379/0
      - CHANNEL_REDIS_HOST=redis
      - RUN_MIGRATIONS=true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/admin/')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - app-network

  # ===========================================================
  # CELERY WORKER — Xử lý tác vụ nền
  # ===========================================================
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    command: celery -A investcore worker -l info -P gevent -c 4
    # ❌ KHÔNG có volumes mount code
    env_file:
      - ./backend/.env.prod
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - REDIS_URL=redis://redis:6379/0
      - CHANNEL_REDIS_HOST=redis
      - CELERY_TASK_ALWAYS_EAGER=False
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # ===========================================================
  # CELERY BEAT — Lập lịch tác vụ định kỳ
  # ===========================================================
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    command: celery -A investcore beat -l info -S django
    # ❌ KHÔNG có volumes mount code
    env_file:
      - ./backend/.env.prod
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - REDIS_URL=redis://redis:6379/0
      - CHANNEL_REDIS_HOST=redis
      - CELERY_TASK_ALWAYS_EAGER=False
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # ===========================================================
  # NGINX — Reverse Proxy + React Static Files
  # ===========================================================
  # Nginx serve React (từ image) + proxy API/WebSocket đến Backend
  # Frontend KHÔNG có container riêng — React files được build
  # trực tiếp vào Nginx image (multi-stage Dockerfile)
  # ===========================================================
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost/api}
        - VITE_WS_URL=${VITE_WS_URL:-ws://localhost/ws}
    ports:
      - "80:80"
    volumes:
      # Shared volume: Backend write → Nginx read Django static files
      - static_files:/usr/share/nginx/static:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

# ===========================================================
# NETWORK — Tất cả services cùng 1 network
# ===========================================================
# Container gọi nhau bằng tên service (db, redis, backend, ...)
# Không cần port mapping — tất cả giao tiếp nội bộ
# ===========================================================
networks:
  app-network:
    driver: bridge

# ===========================================================
# VOLUMES — Dữ liệu bền vững
# ===========================================================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  static_files:
    driver: local