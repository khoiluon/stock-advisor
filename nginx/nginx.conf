# ============================================================
# Nginx Configuration — StockAdvisor Production
# ============================================================
# Nginx đóng vai trò:
# 1. Serve React static files (SPA)
# 2. Reverse proxy cho Django API (/api/, /admin/)
# 3. Proxy WebSocket (/ws/) cho SSI streaming
# 4. Serve Django static files từ shared volume (/static/)
# ============================================================

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # ========================================
    # React SPA — Static Files
    # ========================================
    # Serve React app từ Nginx (build output nằm trong image)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (CSS, JS, images) với Vite hash
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ========================================
    # Django REST API
    # ========================================
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Timeout cho API requests
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # ========================================
    # Django Admin
    # ========================================
    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========================================
    # Django Static Files (Admin CSS/JS)
    # ========================================
    # Serve từ shared volume với Backend (Backend collectstatic → volume)
    location /static/ {
        alias /usr/share/nginx/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # ========================================
    # WebSocket — SSI Streaming + Channels
    # ========================================
    # Cấu hình đặc biệt cho WebSocket proxy:
    # - HTTP/1.1 bắt buộc cho WebSocket upgrade
    # - Upgrade header chuyển giao thức từ HTTP → WS
    # - Timeout dài (24h) giữ kết nối WS ổn định
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}